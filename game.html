<!--
  game.html — Pagina di gioco PaggIa.

  Carica la mappa da map.json (default) e permette import via base64.
  Il giocatore sceglie un personaggio, poi punta e spara palline cliccando sul canvas.
  Colpire un target speciale (verde) attiva il superpotere del personaggio.

  STRUTTURA:
    .wrap                  → container centrato
      .game-header         → titolo + link editor
      .level-section       → select livello classico (default_levels/) + bottone "Carica"
      .import-section      → textarea base64 + bottone "Carica mappa"
      #status              → barra di stato
      #gameCanvas          → canvas di gioco
      #characterPanel      → selettore personaggio + descrizione potere

  CSS: styles.css (base) + styles_game.css (variabili + character UI) + inline <style>
  JS:  game.js (ES module)
-->
<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>PaggIa – Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles_game.css">
  <style>
    .game-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .game-header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .game-header a:hover { text-decoration: underline; }

    .import-section {
      max-width: 700px;
      margin: 0 auto 12px auto;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .import-section textarea {
      flex: 1;
      min-height: 38px;
      max-height: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: transparent;
      color: #fff;
      font-family: monospace;
      font-size: 0.8rem;
      resize: vertical;
    }
    .import-section textarea::placeholder { color: #555; }
    .import-section button {
      white-space: nowrap;
      padding: 8px 14px;
    }

    /* Selettore livello classico */
    .level-section {
      max-width: 700px;
      margin: 0 auto 12px auto;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.85rem;
    }
    .level-section label { color: #999; }
    .level-section select {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.85rem;
    }
    .level-section button {
      white-space: nowrap;
      padding: 6px 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="game-header">
      <h2>PaggIa</h2>
      <a href="./editor.html">Apri Editor</a>
    </div>

    <!-- Selettore livello classico (popolato da game.js da default_levels/index.json) -->
    <div class="level-section">
      <label for="levelSelect">Livello classico:</label>
      <select id="levelSelect">
        <option value="">— seleziona —</option>
      </select>
      <button id="loadLevelBtn">Carica</button>
    </div>

    <!-- Import base64 -->
    <div class="import-section">
      <textarea id="base64Input" placeholder="Incolla qui il base64 di una mappa per caricarla…"></textarea>
      <button id="loadBase64Btn">Carica mappa</button>
    </div>

    <!-- Status bar -->
    <div class="status" id="status">Pronto</div>

    <!-- Canvas di gioco -->
    <canvas id="gameCanvas"></canvas>

    <!-- Selettore personaggio (popolato da game.js) -->
    <div id="characterPanel">
      <h3>Scegli personaggio</h3>
      <div id="characterButtons"></div>
      <div id="characterDesc"></div>
    </div>

  </div>

  <script type="module">
    import './game.js';
  </script>
</body>
</html>
